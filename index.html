const base=Number(v.baseFret)||Math.max(1,Math.min(...positions.map(Number).filter(x=>Number.isFinite(x)&&x>0)));
const left=0,right=230,stepX=(right-left)/5,fretCount=Math.max(4,...positions.filter(p=>p!=='x'&&p!=='0').map(p=>Number(p)-base+1)),stepY=215/fretCount;
let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 215" role="img" aria-label="Diagrama de ${e.name}">`;
for(let i=0;i<6;i++){const x=left+i*stepX;s+=`<line x1="${x}" y1="0" x2="${x}" y2="215" stroke="#d3d3d3" stroke-width="1"/>`;}
for(let i=1;i<fretCount;i++){const y=i*stepY;s+=`<line x1="0" y1="${y}" x2="230" y2="${y}" stroke="#d3d3d3" stroke-width="1"/>`;}
positions.forEach((p,i)=>{const fret=Number(p);if(p==='x'||p==='0'||!Number.isFinite(fret)||fret<base||fret>=base+fretCount)return;const x=left+i*stepX,y=(fret-base+.5)*stepY;s+=`<circle cx="${x}" cy="${y}" r="13" fill="#7100ff"/>`;const f=fingers[i];if(f!=='x'&&f!=='0')s+=`<text x="${x}" y="${y+4.6}" fill="white" font-family="Arial" font-weight="900" font-size="13" text-anchor="middle">${f}</text>`;});return s+'</svg>';}
function chordElement(item){const e=getEntry(item);if(!e)return '<div class="chord-name">—</div>';const v=getShape(e);const base=Number(v.baseFret)||Math.max(1,Math.min(...v.positions.map(Number).filter(x=>Number.isFinite(x)&&x>0)));
const markers=v.positions.map((p,i)=>{if(p!=='x'&&p!=='0')return '';const x=i/5*100;return p==='x'?`<span class="string-marker" style="left:${x}%">X</span>`:`<span class="string-marker open" style="left:${x}%"></span>`;}).join('');
const variations=CHORD_COLLECTION[e.name].length,tag=mode==='variation'?`<div class="voicing-tag">POSIÇÃO ${(e.variation||0)+1} DE ${variations}</div>`:'';
return `<div class="chord-name">${e.name}</div><div class="diagram-shell"><div class="top-markers">${markers}</div><div class="fret-label">${base}º</div><div class="diagram">${chordSVG(e)}</div>${tag}</div>`;}
function render(){const get=i=>i>=0&&i<sequence.length?sequence[i]:null;$('prev').innerHTML=get(index-1)?chordElement(get(index-1)):'';$('current').innerHTML=get(index)?chordElement(get(index)):'';$('next').innerHTML=get(index+1)?chordElement(get(index+1)):'';$('position').textContent=`${Math.min(index+1,sequence.length)} / ${sequence.length}`;
$('round').innerHTML=sequence.map((entry,i)=>{const e=getEntry(entry);const text=e.name+(mode==='variation'?` · ${i+1}`:'');return `<button class="pill ${index===i?'active':''}" data-round="${i}" title="Ir para ${text}">${text}</button>`;}).join('');document.querySelectorAll('[data-round]').forEach(el=>el.onclick=()=>go(Number(el.dataset.round)));
$('roundText').textContent=mode==='harmonic'?'Campo harmônico · '+$('harmonicKey').value+' '+($('harmonicScale').value==='minor'?'menor natural':'maior')+' · '+($('harmonicType').value==='triads'?'tríades':'tétrades'):mode==='variation'?'Posições do acorde '+$('variationChord').value:sequence.length+' acordes selecionados';
$('status').textContent=running?'TREINANDO · '+bpm+' BPM':'PRONTO PARA TREINAR';$('play').style.opacity=running?'.45':'1';document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('selected',freeSelection.includes(b.dataset.chord)));updateClock();renderBeat();}
function updateClock(){const secs=Math.max(0,remaining);$('clock').textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(Math.ceil(secs%60)).padStart(2,'0');}
function stop(){running=false;generation++;if(scheduler)clearInterval(scheduler);scheduler=null;pendingVisuals.forEach(clearTimeout);pendingVisuals=[];pendingNodes.forEach(n=>{try{n.stop()}catch(e){}});pendingNodes=[];const halo=$('halo');if(halo)halo.classList.remove('pulse','pulse-accent');render();}
async function start(){if(running||!sequence.length)return;const ctx=getAudio();if(!ctx){alert('Seu navegador não oferece suporte ao áudio do metrônomo.');return;}try{await ctx.resume();}catch(e){alert('Não foi possível iniciar o áudio.');return;}if(running)return;generation++;running=true;beatNumber=index*beatsPerChord;scheduledBeat=beatNumber;currentBeat=0;remaining=beatsPerChord*60/bpm;nextBeatTime=ctx.currentTime+.035;render();scheduleBeats();scheduler=setInterval(scheduleBeats,25);}
function go(n){const wasRunning=running;if(wasRunning)stop();index=Math.min(sequence.length-1,Math.max(0,n));currentBeat=0;beatNumber=index*beatsPerChord;remaining=beatsPerChord*60/bpm;render();if(wasRunning)start();}
function restart(){stop();go(0);}
function loadSequence(seq){if(!seq.length){stop();sequence=[];index=0;render();return;}stop();sequence=seq;index=0;currentBeat=0;remaining=beatsPerChord*60/bpm;render();}
function loadMode(){document.querySelectorAll('.mode-tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('harmonicPane').classList.toggle('hidden',mode!=='harmonic');$('variationPane').classList.toggle('hidden',mode!=='variation');$('freePane').classList.toggle('hidden',mode!=='free');updateTraining();}
function updateTraining(){if(mode==='harmonic'){const key=$('harmonicKey').value,type=$('harmonicType').value,isMinor=$('harmonicScale').value==='minor';const fields=isMinor?MINOR_HARMONIC_FIELDS:HARMONIC_FIELDS;const list=fields[key][type];$('harmonicDesc').innerHTML=`<strong>${key} ${isMinor?'menor natural':'maior'} · ${type==='triads'?'Tríades':'Tétrades'}</strong><div>${list.join(' · ')}</div>`;loadSequence(list);}
else if(mode==='variation'){const name=$('variationChord').value;const variants=CHORD_COLLECTION[name]||[];$('variationDesc').innerHTML=`<strong>${name}</strong><div>${variants.length} posição(ões) no braço do violão.</div>`;loadSequence(variants.map((_,i)=>({name,variation:i})));}
else{loadSequence(freeSelection.slice());}}
document.querySelectorAll('.mode-tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;loadMode();});
function refreshHarmonicKeys(){const isMinor=$('harmonicScale').value==='minor';const keys=isMinor?DATA.minorKeys:DATA.keys;$('harmonicKey').innerHTML=keys.map(k=>`<option value="${k}">${isMinor?k+' (menor)':k+' (maior)'}</option>`).join('');$('harmonicKey').value=isMinor?'Am':'C';updateTraining();}
$('harmonicScale').onchange=refreshHarmonicKeys;refreshHarmonicKeys();$('harmonicKey').onchange=updateTraining;$('harmonicType').onchange=updateTraining;
$('variationChord').innerHTML=Object.keys(CHORD_COLLECTION).sort((a,b)=>a.localeCompare(b,'en')).map(k=>`<option value="${k}">${k}</option>`).join('');$('variationChord').value='C';$('variationChord').onchange=updateTraining;
const grid=$('choices');Object.keys(CHORD_COLLECTION).sort((a,b)=>a.localeCompare(b,'en')).forEach(name=>{const b=document.createElement('button');b.className='choice';b.textContent=name;b.dataset.chord=name;b.title='Selecionar '+name;b.onclick=()=>{if(freeSelection.includes(name))freeSelection=freeSelection.filter(n=>n!==name);else freeSelection.push(name);b.classList.toggle('selected',freeSelection.includes(name));};grid.append(b);});
$('clearFree').onclick=()=>{freeSelection=[];document.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));};$('useFree').onclick=()=>{if(!freeSelection.length){alert('Selecione ao menos um acorde.');return;}updateTraining();};
$('play').onclick=start;$('pause').onclick=stop;$('loop').onclick=()=>{loopEnabled=!loopEnabled;const button=$('loop');button.setAttribute('aria-pressed',String(loopEnabled));button.setAttribute('aria-label',loopEnabled?'Desativar repetição contínua':'Ativar repetição contínua');button.title=loopEnabled?'Loop ligado — clique para desligar':'Loop desligado — clique para repetir';};$('forward').onclick=()=>go(index+1);$('back').onclick=()=>go(index-1);$('nextBottom').onclick=()=>go(index+1);$('previousBottom').onclick=()=>go(index-1);$('restart').onclick=restart;
$('bpm').onchange=e=>{const n=Math.max(40,Math.min(240,Math.round(Number(e.target.value)||80)));e.target.value=n;bpm=n;const wasRunning=running;if(wasRunning)stop();remaining=beatsPerChord*60/bpm;render();if(wasRunning)start();};
$('beats').onchange=e=>{const wasRunning=running;if(wasRunning)stop();beatsPerChord=Number(e.target.value);remaining=beatsPerChord*60/bpm;currentBeat=0;render();if(wasRunning)start();};
$('mute').onclick=e=>{muted=!muted;e.currentTarget.setAttribute('aria-pressed',String(muted));e.currentTarget.textContent=muted?'Som desligado':'Som ligado';};
$('chordMode').onclick=()=>document.querySelector('.training-panel').scrollIntoView({behavior:'smooth',block:'nearest'});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();running?stop():start()}else if(e.code==='ArrowRight')go(index+1);else if(e.code==='ArrowLeft')go(index-1)});
window.carregarRodada=function(items){if(!Array.isArray(items)||!items.length)throw Error('A rodada precisa conter acordes');const seq=items.map(item=>{const name=typeof item==='string'?item:item.name;if(!name)throw Error('Acorde sem nome');if(typeof item==='object'&&Array.isArray(item.positions))CHORD_COLLECTION[name]=[{positions:item.positions,fingerings:item.fingerings||item.positions,baseFret:item.baseFret||1}];if(!CHORD_COLLECTION[name])throw Error('Acorde não cadastrado: '+name);return name;});mode='free';freeSelection=seq.slice();loadMode();};
window.carregarDados=function(dados){if(!dados||!dados.chords||!dados.harmonicFields)throw Error('JSON deve incluir chords e harmonicFields');Object.assign(CHORD_COLLECTION,dados.chords);Object.assign(HARMONIC_FIELDS,dados.harmonicFields);if(dados.minorHarmonicFields)Object.assign(MINOR_HARMONIC_FIELDS,dados.minorHarmonicFields);if(Array.isArray(dados.minorKeys))DATA.minorKeys=dados.minorKeys;if(Array.isArray(dados.keys))DATA.keys=dados.keys;refreshHarmonicKeys();loadMode();};
loadMode();
</script></body></html>
